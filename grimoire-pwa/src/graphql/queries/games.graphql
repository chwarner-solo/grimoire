query Games {
  games {
    id
    name
    status
    campaignCount
    lastActivityAt
  }
}

query Game($id: ID!) {
  game(id: $id) {
    id
    name
    status
    locationSummary {
      draft
      active
      idle
      archived
    }
    factionSummary {
      draft
      active
      idle
      archived
    }
    npcSummary {
      draft
      active
      idle
      archived
    }
    campaigns {
      id
      name
      status
      characterCount
      sessionCount
    }
  }
}
